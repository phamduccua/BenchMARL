defaults:
  - pcvi_config
  - _self_

# Algorithm 1 of https://doi.org/10.1002/mma.11132 (Step 1 parameters).
# NOTE: `p` is what the paper calls `theta`; renamed to avoid the clash with the
# network parameters.

# lambda_0 = lambda > 0, the initial step. lambda_k is non-increasing, so this is
# also an upper bound on the learning rate for the whole run.
#
# How to pick it. Step 3 gives
#     lambda_{k+1} = min(p ||u_k - v_k|| / ||F(u_k) - F(v_k)||, lambda_k)
# and ||u_k - v_k|| = lambda_k ||F(u_k)||, so the first argument is
# ~ p / L_local, where L_local is the local Lipschitz constant of F. Hence:
#
#   * lambda_k only ever shrinks while lambda_k > p / L_local
#   * it settles at ~ p / L_local
#   * if lambda_0 is ALREADY below p / L_local, the adaptive mechanism never
#     fires and the method degenerates into fixed-step extragradient
#
# Measured on IPPO + vmas/balance + MLP: lambda settles at ~2e-3 from any
# lambda_0 >= 1e-2 (so L_local ~ 200), and stays pinned at lambda_0 for
# lambda_0 <= 1e-3. 0.01 is therefore high enough for the adaptation to engage
# without the very large first steps that lambda_0 = 1 produces.
lambda_0: 0.01
# beta in (0, 2)
beta: 1.95
# p in (0, 1)
p: 0.5
# gamma > 0. Has no numerical effect (when d_k = 0 the iterate does not move);
# kept for fidelity to the paper.
gamma: 1.0

# --- Below: NOT in the paper. Defaults are the faithful ones (no safeguard), so
# --- that a first run measures whether the safeguards are needed at all.
# Floor for lambda_k. 0.0 = faithful.
lambda_min: 0.0
# Clamps for beta_k. null = no clamp = faithful.
# Measured on the task above: beta_k < 0 on ~1.3% of the steps at lambda_0 >= 0.1
# and never at lambda_0 <= 0.01. Watch pcvi_beta_clamped_* in the logs.
beta_k_min: null
beta_k_max: null
# Threshold below which ||F(u_k) - F(v_k)|| counts as zero
eps_denominator: 1.0e-12
# Use the identity d_k = lambda_k F(v_k) instead of formula (3.1). Numerically
# equivalent, and better conditioned in float32 (formula (3.1) computes
# "a - a + b" explicitly). False = formula (3.1) applied literally.
use_identity_dk: False
# Reset lambda_k to lambda_0 at the start of every collection round
reset_lambda_per_batch: False
# Step 3's update of lambda. True = pcvi (the full Algorithm 1).
# The `pc` variant sets this to False; use optimizer=pc rather than
# flipping it here, so the two show up as different runs.
use_adaptive_lambda: True
# Step 5's contraction coefficient. True = pcvi. Setting it False gives
# Korpelevich's extragradient; use optimizer=extragradient for that.
use_contraction: True
